name: update-reporting-schedule
on:
  schedule:
    # Weekdays 05:40 KST = previous day 20:40 UTC
    - cron: '40 20 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reporting-schedule
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and merge future reporting events
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
        run: python scripts/update_schedule.py
      - name: Commit schedule if changed
        run: |
          git config user.name "pharm-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule/events.json
          if git diff --cached --quiet; then
            echo "No schedule changes"
            exit 0
          fi
          git commit -m "[no-telegram] Update reporting schedule"
          git pull --rebase origin main
          git push
