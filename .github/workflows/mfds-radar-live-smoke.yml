name: mfds-efficacy-ui-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfds/**'
      - 'scripts/mfds_indication_push_smoke.mjs'
      - '.github/workflows/mfds-radar-live-smoke.yml'
permissions:
  contents: read
jobs:
  efficacy-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original indication feed, date range, autocomplete and push configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          BASE="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/"
          def read(path,params):
              query=urllib.parse.urlencode(params)
              with urllib.request.urlopen(BASE+path+"?"+query,timeout=30) as response:
                  assert response.status==200
                  return json.load(response)
          data=read("mfds-indication-monitor",{"view":"efficacy","limit":50})
          assert data["total"]>=30,data["total"]
          assert data["master_scope"]=="official_originals",data
          assert data["master_primary_count"]>=20,data
          dates=[x["changed_at"] for x in data["items"]]
          assert dates==sorted(dates,reverse=True),"Changes not sorted by actual date"
          accepted={"new_drug","biologic_original","orphan_original","reference_original","incremental_new_drug","innovative_data_submission","biosimilar","generic"}
          assert all(x["item_seq"] and x["product_role"] in accepted for x in data["items"]),"Unverified watch item leaked into primary feed"
          period=read("mfds-indication-monitor",{"view":"efficacy","start":"2026-07-01","end":"2026-10-27","type":"추가","limit":50})
          assert all("2026-07-01"<=x["changed_at"]<="2026-10-27" for x in period["items"]),period["period"]
          tevim=read("mfds-indication-monitor",{"view":"efficacy","q":"테빔브라","limit":50})
          assert any(x["changed_at"]=="2025-12-18" for x in tevim["items"]),tevim
          suggest=read("mfds-indication-monitor",{"view":"suggest","q":"키트"})
          assert any("키트루다" in x["product"] for x in suggest["matches"]),suggest
          config=read("mfds-webpush",{"view":"config"})
          assert len(config["public_key"])>70,config
          assert config["site"].endswith("/pharm-briefing-desk/mfds/"),config
          print("MFDS_API_PERIOD_SUGGEST_PUSH_OK",data["total"],len(tevim["items"]),len(suggest["matches"]))
          PY
      - name: Test indication UI, settings dialog, search and mobile on local files and Pages
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mfds-ui-server.log 2>&1 &
          sleep 1
          node scripts/mfds_indication_push_smoke.mjs 'http://127.0.0.1:8765/mfds/'
          # The Pages build may run slightly after this workflow starts.
          for i in $(seq 1 30); do
            if curl -fsSL 'https://luckybomb85-tech.github.io/pharm-briefing-desk/mfds/push-ui.js' | grep -q 'mfds_indication_push_device_v1'; then
              break
            fi
            sleep 5
          done
          node scripts/mfds_indication_push_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/mfds/?v=20261027-alerts'
