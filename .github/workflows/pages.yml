name: Deploy briefing desk to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/*.json'
      - 'index.html'
      - 'schedule/**'
      - 'config/**'
      - 'scripts/validate_briefing.py'
      - 'scripts/verify_live_briefing.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate latest briefing
        run: python scripts/validate_briefing.py --mode latest
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployed briefing
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_live_briefing.py
