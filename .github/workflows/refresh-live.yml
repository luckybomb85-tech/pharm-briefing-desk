name: refresh-live-briefing-retired

# Retired: the daily briefing now has a single staged generation -> validation -> publish path.
# Keep this workflow only for manual diagnostics of live refresh requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm retired worker
        run: echo "Scheduled live refresh is retired; daily briefing uses the staged pipeline."
