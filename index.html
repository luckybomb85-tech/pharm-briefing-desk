<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데일리팜 제약바이오 브리핑 데스크</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#26384b;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:24px auto;background:white;min-height:80vh;border:1px solid #e0e7ee;border-radius:18px;overflow:hidden}header{padding:25px 28px;border-bottom:1px solid #e5ebf1}.brandrow{display:flex;align-items:center;gap:12px}.brandMark{background:#173f65;color:white;font-weight:800;border-radius:10px;padding:12px}.brand{font-size:20px;font-weight:800}.version{font-size:11px;color:#5b6e80;border:1px solid #d7e1eb;padding:4px 7px;border-radius:6px}.datebar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:25px}.date{font-weight:700}.datebar button,.tab{border:1px solid #d8e1ea;border-radius:9px;background:white;color:#26384b;padding:9px 14px;cursor:pointer}.dateinput{border:1px solid #d8e1ea;border-radius:9px;padding:9px}main{padding:24px 28px}.tabs{display:flex;gap:8px;border-bottom:1px solid #e5ebf1;padding-bottom:14px}.tab{font-weight:750}.tab.active{background:#173f65;color:white}.count{opacity:.7}.status{font-size:12px;color:#63778a;margin:16px 0 0}.article{border:1px solid #e0e7ee;border-radius:13px;padding:17px;margin-top:14px}.article h3{font-size:17px;margin:8px 0}.meta{font-size:12px;color:#68798b}.summary{line-height:1.65;color:#405468;font-size:14px;white-space:pre-line}.article a{color:#176197}.empty{margin:35px 0;padding:42px 20px;text-align:center;border:1px dashed #d9e1ea;border-radius:14px;color:#68798b;line-height:1.8}@media(max-width:650px){.shell{margin:0;border:0;border-radius:0}.brand{font-size:16px}header,main{padding:18px}.datebar{flex-wrap:wrap}}</style></head><body><div class="shell"><header><div class="brandrow"><div class="brandMark">DP</div><div class="brand">데일리팜 제약바이오 브리핑 데스크</div><span class="version">NEW START</span></div><div class="datebar"><button id="prev" aria-label="이전 날짜">‹</button><div class="date" id="dateLabel"></div><button id="next" aria-label="다음 날짜">›</button><input class="dateinput" id="datePicker" type="date"></div></header><main><nav class="tabs"><button class="tab active" data-tab="domestic">국내 <span class="count">0</span></button><button class="tab" data-tab="global">글로벌 <span class="count">0</span></button><button class="tab" data-tab="patent">특허 <span class="count">0</span></button></nav><section id="cards"><div class="empty">기사 데이터를 불러오고 있습니다. 요약·기사화는 아직 연결되지 않았습니다.</div></section></main></div><script>
const SECTIONS=['domestic','global','patent'];
let date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),tab='domestic',generation=0;
const label=document.getElementById('dateLabel'),picker=document.getElementById('datePicker'),cards=document.getElementById('cards');
const decodeEntities=s=>{const t=document.createElement('textarea');t.innerHTML=String(s??'');return t.value};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validURL=u=>{try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null}catch{return null}};
function normalized(raw){
 if(!raw||raw.schema_version!=='briefing-v2'||raw.date!==date||!SECTIONS.every(k=>Array.isArray(raw[k])))throw Error('데이터 형식이 올바르지 않습니다');
 return raw;
}
function article(x){
 const url=validURL(x.url||x.source),title=escapeHTML(decodeEntities(x.title||'제목 없음')),summary=String(x.summary||'').trim();
 return '<article class="article"><div class="meta">'+escapeHTML(x.source_name||'출처 미확인')+' · '+escapeHTML(x.published_at||'발행시각 미확인')+'</div><h3>'+title+'</h3><p class="summary">'+escapeHTML(summary||'기사 요약은 아직 준비되지 않았습니다.')+'</p>'+(url?'<a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(url)+'">원문 보기 ↗</a>':'<span class="meta">원문 링크 미확인</span>')+'</article>';
}
async function render(){
 const token=++generation;
 label.textContent=date;picker.value=date;
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 cards.innerHTML='<div class="empty">브리핑 데이터를 확인하고 있습니다.</div>';
 try{
  const res=await fetch('https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/briefing-feed-v2?date='+encodeURIComponent(date),{cache:'no-store'});
  if(token!==generation)return;
  if(res.status===404){showEmpty('해당 날짜의 브리핑 후보가 아직 없습니다.');return}
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=normalized(await res.json());if(token!==generation)return;
  document.querySelectorAll('[data-tab]').forEach(b=>b.querySelector('.count').textContent=data[b.dataset.tab].length);
  const items=data[tab];
  cards.innerHTML='<p class="status">데이터 상태: '+escapeHTML(data.status==='candidate'?'수집 후보 · 검증·선별 전':data.status||'미확인')+' · '+escapeHTML(date)+'</p>'+(items.length?items.map(article).join(''):'<div class="empty">검증된 '+({domestic:'국내',global:'글로벌',patent:'특허'}[tab])+' 기사가 없습니다.</div>');
 }catch(e){if(token!==generation)return;showEmpty('데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.');console.error('Briefing load failed',e)}
}
function showEmpty(message){document.querySelectorAll('[data-tab] .count').forEach(e=>e.textContent='0');cards.innerHTML='<div class="empty">'+escapeHTML(message)+'</div>'}
function move(n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);date=d.toISOString().slice(0,10);render()}
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
picker.onchange=()=>{if(picker.value){date=picker.value;render()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script></body></html>
