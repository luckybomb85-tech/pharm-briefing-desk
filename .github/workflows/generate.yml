name: generate-daily-briefing-retired

# Daily briefing generation is owned by the ChatGPT scheduled task.
# GitHub no longer calls the OpenAI API or requires OPENAI_API_KEY.
# A data/YYYY-MM-DD.json commit triggers publish.yml and pages.yml.
# This workflow remains only as a manual diagnostic validator.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate today's briefing if present
        run: python scripts/validate_briefing.py --mode today
