name: briefing-healthcheck

on:
  workflow_dispatch:
  schedule:
    # 08:00 KST, Monday-Friday. ChatGPT owns generation/recovery.
    - cron: '0 23 * * 0-4'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today's 10-10-5 briefing
        run: python scripts/validate_briefing.py --mode today
