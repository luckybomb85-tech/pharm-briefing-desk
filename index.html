<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제약바이오 브리핑 데스크</title>
<style>
:root{--bg:#f5f7f9;--card:#fff;--ink:#152334;--muted:#687789;--line:#d7e0e7;--navy:#183f63;--blue:#2864df;--red:#c73555;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,a,input,textarea{font:inherit}.shell{max-width:820px;margin:auto;min-height:100vh;padding-bottom:28px}
header{padding:20px 28px 14px;border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;gap:11px}.brandicon{width:42px;height:42px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center}.brandicon svg{width:22px}.brand{font-size:22px;font-weight:780;letter-spacing:-.55px}.version{font-size:12px;font-weight:600;border:1px solid #d2dbe3;border-radius:999px;padding:2px 8px;margin-left:6px;color:#536172;background:#f9fafb}.gear{margin-left:auto;width:38px;height:38px;border:1px solid #d6dfe6;border-radius:12px;background:transparent;color:#526273;display:grid;place-items:center}.gear svg{width:19px;height:19px}
.datebar{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-top:11px}.datebar button{border:0;background:transparent;color:#647385;height:32px;display:grid;place-items:center}.datebar svg{width:18px}.date{font-size:18px;font-weight:780;text-align:center;letter-spacing:-.3px;cursor:pointer}.dateinput{position:absolute;opacity:0;pointer-events:none}.connect{display:none}
main{padding:18px 28px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px;border:1px solid #d8e1e8;border-radius:13px;overflow:hidden}.tab{height:46px;border:0;border-right:1px solid #d8e1e8;background:#f0f3f6;font-size:17px;color:#4c5a69}.tab:last-child{border-right:0}.tab.active{background:#e7edf2;color:#152334;font-weight:750}.count{display:inline-grid;place-items:center;min-width:27px;height:27px;padding:0 7px;margin-left:5px;border-radius:999px;background:#fafbfc;font-size:13px}
.card{background:var(--card);border:1px solid #d9e1e7;border-radius:18px;padding:17px 18px 15px;margin:0 0 12px;box-shadow:0 2px 5px rgba(31,49,68,.08)}.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}.pill{border:1px solid #ccd7df;border-radius:999px;padding:3px 8px;color:#334559;background:#fff;flex:none}.source{overflow:hidden;text-overflow:ellipsis}.title{font-size:20px;line-height:1.38;letter-spacing:-.48px;margin:9px 0 13px;font-weight:790}
.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr 40px 40px;gap:6px}.actions button{height:39px;border:1px solid #d4dde5;border-radius:11px;background:#fafbfc;color:#26384b;font-weight:680;font-size:13px}.vote{padding:0;display:grid;place-items:center;color:#69798a}.vote svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.vote.on.up{color:var(--blue);border-color:#a8bced;background:#f5f7ff}.vote.on.down{color:var(--red);border-color:#e5b2bf;background:#fff7f8}
.detail{display:none;border-top:1px solid #e8edf1;margin-top:14px;padding-top:13px}.detail.open{display:block}.detail h3{font-size:13px;margin:0 0 6px}.detail p{font-size:14px;line-height:1.62;margin:0 0 11px;color:#425164}.detailtools{display:flex;gap:6px;flex-wrap:wrap}.detailtools button,.detailtools a{border:1px solid #d5dee5;background:#fff;border-radius:9px;padding:7px 10px;text-decoration:none;color:#25384b;font-size:13px;font-weight:680}.detailtools .primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:54px 20px}.settings{display:none;background:#fff;border-bottom:1px solid var(--line);padding:17px 28px}.settings.open{display:block}.settings h2{font-size:16px;margin:0 0 3px}.settings p{color:var(--muted);font-size:12px}.settings label{display:block;font-size:13px;font-weight:750;margin:10px 0 4px}.settings textarea{width:100%;min-height:52px;border:1px solid #d5dfe7;border-radius:9px;padding:8px;font-size:13px}.settings button{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:8px 13px;font-size:13px;font-weight:750}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);background:#142233;color:#fff;border-radius:10px;padding:9px 13px;font-size:13px;display:none}
@media(max-width:640px){header{padding:16px 17px 11px}.brandrow{gap:9px}.brandicon{width:38px;height:38px;border-radius:12px}.brandicon svg{width:20px}.brand{font-size:19px}.version{font-size:11px;padding:1px 7px}.gear{width:35px;height:35px;border-radius:11px}.datebar{margin-top:8px}.date{font-size:17px}main{padding:15px 14px}.tabs{margin-bottom:13px}.tab{height:43px;font-size:16px}.count{min-width:25px;height:25px;font-size:12px}.card{border-radius:16px;padding:14px 14px 13px;margin-bottom:10px}.meta{font-size:12px}.pill{padding:3px 7px}.title{font-size:18px;line-height:1.36;margin:8px 0 12px}.actions{grid-template-columns:1.2fr 1fr 1fr 38px 38px;gap:5px}.actions button{height:37px;border-radius:10px;font-size:12px}.vote svg{width:17px}.settings{padding:15px 17px}}
@media(max-width:380px){.brand{font-size:17px}.version{display:none}.actions{grid-template-columns:1.15fr .95fr .95fr 36px 36px}.actions button{font-size:11px}}
</style></head><body><div class="shell">
<header><div class="brandrow"><div class="brandicon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M7.8 8.1a5.5 5.5 0 0 0 0 7.8M16.2 8.1a5.5 5.5 0 0 1 0 7.8M4.6 5a10 10 0 0 0 0 14M19.4 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="brand">제약바이오 브리핑 데스크 <span class="version">v3.7</span></div><button class="gear" id="gear" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
<div class="datebar"><button id="prev" aria-label="이전 날짜"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="date" id="dateLabel"></div><button id="next" aria-label="다음 날짜"><svg viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><input class="dateinput" id="datePicker" type="date"></div>
<div class="connect"><b>● 텔레그램 연결됨</b> · 자동 게시</div></header>
<section class="settings" id="settings"><h2>브리핑 설정</h2><p>우선 검색 사이트는 현재 이 기기에 저장됩니다. 서버 동기화는 다음 단계에서 연결합니다.</p><label>국내</label><textarea id="sDomestic"></textarea><label>글로벌</label><textarea id="sGlobal"></textarea><label>특허</label><textarea id="sPatent"></textarea><p><button id="saveSettings">설정 저장</button></p></section>
<main><nav class="tabs"><button class="tab active" data-tab="domestic">국내 <span class="count" id="cDomestic">0</span></button><button class="tab" data-tab="global">글로벌 <span class="count" id="cGlobal">0</span></button><button class="tab" data-tab="patent">특허 <span class="count" id="cPatent">0</span></button></nav><section id="cards"></section></main></div><div class="toast" id="toast"></div>
<script>
let D=null,tab='domestic';let current=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return '원문'}}
function fmtDate(s){const [y,m,d]=s.split('-');return y+'년 '+Number(m)+'월 '+Number(d)+'일'}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',1500)}
async function load(date=current){current=date;$('#datePicker').value=date;$('#dateLabel').textContent=fmtDate(date);try{const r=await fetch('./data/'+date+'.json',{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();render()}catch{D=null;render()}}
function render(){const counts={domestic:D?.domestic?.length||0,global:D?.global?.length||0,patent:D?.patent?.length||0};$('#cDomestic').textContent=counts.domestic;$('#cGlobal').textContent=counts.global;$('#cPatent').textContent=counts.patent;const a=D?.[tab]||[];$('#cards').innerHTML=a.length?a.map((x,i)=>card(x,i)).join(''):(current==='2026-09-29'?'<div class="empty">9월 29일은 기존 v3.7 아카이브에 보존돼 있습니다.<br><br><a href="https://pharm-briefing-desk.luckybomb85.chatgpt.site" style="display:inline-block;padding:11px 16px;border:1px solid #ccd8e1;border-radius:12px;color:#173f65;text-decoration:none;font-weight:800">9월 29일 데스크 열기 ↗</a></div>':'<div class="empty">'+fmtDate(current)+' 브리핑이 아직 없습니다.</div>')}
function card(x,i){const rating=localStorage.getItem('rating:'+current+':'+tab+':'+i);const metaTime=x.published_at?'<span>·</span><span>'+esc(x.published_at)+'</span>':'';return '<article class="card"><div class="meta"><span class="pill">'+esc(x.tag||'주목')+'</span><span>·</span><span class="source">'+esc(x.source_name||host(x.source))+'</span>'+metaTime+'</div><div class="title">'+esc(x.title)+'</div><div class="actions"><button onclick="toggleDetail('+i+')">원문·상세</button><button onclick="article('+i+',\'quick\')">빠른 추격</button><button onclick="article('+i+',\'diff\')">차별화</button><button class="vote up '+(rating==='1'?'on':'')+'" onclick="rate('+i+',1)" aria-label="좋아요">👍</button><button class="vote down '+(rating==='-1'?'on':'')+'" onclick="rate('+i+',-1)" aria-label="싫어요">👎</button></div><div class="detail" id="detail-'+i+'"><h3>핵심 요약</h3><p>'+esc(x.summary||'상세 요약이 없습니다.')+'</p><div class="detailtools"><a href="'+esc(x.source)+'" target="_blank" rel="noreferrer">원문 확인 ↗</a><button onclick="article('+i+',\'write\')">기사작성 요청 복사</button></div></div></article>'}
window.toggleDetail=i=>$('#detail-'+i).classList.toggle('open');
function promptFor(x,mode){let p='다음 제약바이오 이슈를 데일리팜 기사로 작성해줘.\n제목: '+x.title+'\n요약: '+x.summary+'\n원문: '+x.source;if(mode==='quick')p+='\n빠른 추격기사 관점으로 핵심 팩트, 새로 확인할 수치, 국내 영향 중심으로 기사화 포인트를 잡아줘.';else if(mode==='diff')p+='\n단순 번역·요약을 피하고 경쟁구도, 숫자, 국내 업계 파급효과에서 차별화 야마와 추가 취재 포인트를 잡아줘.';else p+='\n원문을 우선 확인하고 팩트체크한 뒤 제목·부제와 기사 본문 초안을 작성해줘.';return p}
window.article=async(i,mode)=>{const x=D[tab][i];try{await navigator.clipboard.writeText(promptFor(x,mode));toast(mode==='write'?'기사작성 요청을 복사했습니다':mode==='quick'?'빠른 추격 요청을 복사했습니다':'차별화 요청을 복사했습니다')}catch{toast('복사에 실패했습니다')}};
window.rate=(i,v)=>{localStorage.setItem('rating:'+current+':'+tab+':'+i,String(v));render();toast(v>0?'좋아요를 저장했습니다':'싫어요를 저장했습니다')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
function shift(n){const d=new Date(current+'T12:00:00');d.setDate(d.getDate()+n);load(d.toISOString().slice(0,10))}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#dateLabel').onclick=()=>$('#datePicker').showPicker?.();$('#datePicker').onchange=e=>load(e.target.value);
$('#gear').onclick=()=>$('#settings').classList.toggle('open');const keys=['Domestic','Global','Patent'];keys.forEach(k=>$('#s'+k).value=localStorage.getItem('sources:'+k)||'');$('#saveSettings').onclick=()=>{keys.forEach(k=>localStorage.setItem('sources:'+k,$('#s'+k).value));toast('설정을 저장했습니다')};load();
</script></body></html>
