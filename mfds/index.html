<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>효능·효과 변경이력 | 데일리팜</title>
<style>
:root{--ink:#17243a;--muted:#69768b;--border:#e1e7ee;--wash:#f7f8fb;--blue:#2458a6;--green:#157347;--red:#b44242}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1070px;padding:30px 22px 80px;margin:auto}
header{margin:0 0 17px}
h1{margin:0 0 5px;font-size:27px;letter-spacing:-.85px}
.subtitle{margin:0;color:var(--muted);font-size:12px}
.search{display:flex;flex-wrap:wrap;gap:9px;background:white;border:1px solid var(--border);border-radius:12px;padding:13px;margin:18px 0}
.search input,.search select{border:1px solid #d7deea;border-radius:8px;background:white;padding:10px 11px;height:43px;color:var(--ink);min-width:0}
.search input{flex:1 1 260px;min-width:180px}
.search select{flex:0 1 138px;min-width:112px;max-width:160px}
.search .submit{height:43px;min-width:83px;background:#224f9b;border:1px solid #224f9b;border-radius:8px;color:white;font-weight:750;padding:8px 17px}
.search .submit:hover{background:#143d84}
.search button:disabled{opacity:.65;cursor:default}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:21px 1px 9px}
.bar strong{font-size:15px}.bar small{font-size:12px;color:var(--muted)}
.entries{display:flex;flex-direction:column;gap:9px}
.entry{border:1px solid var(--border);border-radius:10px;background:white;overflow:hidden}
.entry summary{display:flex;align-items:center;gap:11px;padding:16px 17px;cursor:pointer;list-style:none;min-height:69px}
.entry summary::-webkit-details-marker{display:none}
.entry summary:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.entry[open] summary{border-bottom:1px solid var(--border);background:#fafcff}
.date{color:#435773;font-size:13px;font-weight:760;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{border-radius:6px;display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;line-height:1.35;padding:4px 9px;background:#edf0f5;color:#415573}
.tag.add{color:#0d6d47;background:#e3f4ed}
.tag.delete{color:#a23d3d;background:#fdebed}
.tag.change{color:#244d95;background:#eaf0fb}
.entry-main{flex:1;min-width:0}
.drug{font-size:16px;font-weight:780;letter-spacing:-.35px;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.arrow{font-size:17px;color:#8491a4;transform:rotate(0);transition:transform .15s;flex:0 0 auto}
.entry[open] .arrow{transform:rotate(180deg)}
.content{padding:17px 20px 21px}
.content h3{font-size:13px;margin:19px 0 8px;letter-spacing:-.2px}
.content h3:first-child{margin-top:0}
.hint{color:var(--muted);font-size:12px;margin:1px 0 11px}
.delta{display:flex;flex-direction:column;gap:5px}
.line{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;padding:5px 9px;border-radius:5px}
.line.added{background:#ebf7f0;border-left:3px solid #2f9971}
.line.removed{background:#fff0f0;border-left:3px solid #d77676;text-decoration:line-through;text-decoration-color:#bd7b7b}
.line.current{padding:5px 8px;border-radius:0}
.line.current.is-added{background:#e6f5ed;border-left:3px solid #29936d;padding-left:9px}
.fulltext{border:1px solid #e7ebf2;border-radius:9px;padding:10px 12px;max-height:450px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.fulltext .line{white-space:pre-wrap}
.contents-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.contents-footer small{font-size:11px;color:#778297}
.empty{text-align:center;background:white;border:1px solid var(--border);border-radius:10px;padding:55px 15px;color:var(--muted)}
.more{display:flex;justify-content:center;padding:22px 0;min-height:55px}
.more button{border:1px solid #ccd6e6;background:white;border-radius:8px;color:var(--blue);padding:10px 22px;font-weight:800}
.more button:disabled{opacity:.55}
.error{color:#a43737;font-size:12px}
footer{font-size:11px;color:#8a94a4;margin-top:26px}
#sentinel{height:1px}
@media(max-width:760px){
.wrap{padding:20px 12px 65px}h1{font-size:23px}
.search{gap:7px;padding:10px}
.search input{flex:1 1 100%;width:100%;min-width:0}
.search select{flex:1 1 25%;width:auto;min-width:0;max-width:none;padding:8px 6px;font-size:12px}
.search .submit{flex:1 1 100%;width:100%}
.entry summary{gap:8px;padding:14px 12px;flex-wrap:wrap}
.entry-main{flex:1 1 55%;order:0}
.date{order:0;font-size:12px}.tag{order:0}
.drug{font-size:15px}
.arrow{margin-left:auto}
.content{padding:13px}
.fulltext{max-height:350px}
.bar{align-items:baseline}
}
</style>
</head>
<body>
<main class="wrap">
<header>
  <h1>효능·효과 변경이력</h1>
  <p class="subtitle">식약처 실제 변경일 기준 · 품목을 누르면 변경 전후 내용을 확인할 수 있습니다.</p>
</header>
<form class="search" id="searchForm" autocomplete="off">
  <input type="search" id="keyword" aria-label="검색어" placeholder="품목명 · 회사명 · 성분명 검색">
  <select id="year" aria-label="연도"><option value="all">전체 연도</option></select>
  <select id="type" aria-label="변경 유형">
    <option value="all">전체 유형</option>
    <option value="추가">추가</option>
    <option value="변경">변경</option>
    <option value="삭제">삭제</option>
  </select>
  <select id="scope" aria-label="자료 구분">
    <option value="all">전체 자료</option>
    <option value="compared">변경내용 확인</option>
    <option value="uncompared">원문 미확인</option>
  </select>
  <button class="submit" id="searchButton" type="submit">검색</button>
</form>
<div class="bar"><strong id="resultCount">검색 결과 확인 중…</strong><small id="sortLabel">변경일 최신순</small></div>
<section id="entries" class="entries" aria-label="효능효과 변경 목록" aria-live="polite">
  <div class="empty">자료를 불러오는 중입니다.</div>
</section>
<div class="more" id="moreWrap" hidden><button type="button" id="moreButton">이전 변경이력 더 보기</button></div>
<div id="sentinel"></div>
<footer>식약처 품목 변경이력의 전자화된 원문을 비교합니다. ‘추가·삭제’ 표시는 문구의 증감 기준이며 적응증의 임상적 확대·폐지와 반드시 일치하지는 않습니다. 원문이 없는 변경일은 별도로 표시됩니다.</footer>
</main>
<script>
(()=>{
"use strict";
const API="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor";
const $=s=>document.querySelector(s);
const state={rows:[],offset:0,total:0,more:false,busy:false,serial:0,filter:{}};
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text??"");return n;}
function put(where,tag,cls,text){const n=element(tag,cls,text);where.appendChild(n);return n}
function fmtDate(day){return /^\d{4}-\d{2}-\d{2}$/.test(day||"")?day.replaceAll("-","."):"날짜 미확인"}
function originalLink(url,label){
 const a=element("a","",label);
 a.href=/^https:\/\//.test(url||"")?url:"#";
 a.target="_blank";a.rel="noopener noreferrer";return a;
}
function normalizeLine(text){return String(text||"").normalize("NFKC").replace(/^\s*\d{1,2}\s*[.)]\s*/,"").replace(/\s+/g," ").trim()}
function makeLines(container,items,kind){
 for(const line of items||[])put(container,"div","line "+kind,line);
}
function renderCard(row){
 const card=element("details","entry");
 card.dataset.id=row.id;
 const summary=put(card,"summary","");
 const tagClass=row.change_type==="추가"?"add":row.change_type==="삭제"?"delete":"change";
 put(summary,"span","date",fmtDate(row.changed_at));
 put(summary,"span","tag "+tagClass,row.change_type);
 const heading=put(summary,"span","entry-main");
 put(heading,"span","drug",row.product);
 put(heading,"span","meta",[row.company,row.ingredient].filter(Boolean).join(" · "));
 put(summary,"span","arrow","⌄");
 const panel=put(card,"div","content");
 const added=Array.isArray(row.added_lines)?row.added_lines:[];
 const removed=Array.isArray(row.removed_lines)?row.removed_lines:[];
 const official=row.diff_status==="compared";
 const hasDelta=official&&(added.length||removed.length);
 if(hasDelta){
   put(panel,"h3","", "이번 변경에서 달라진 부분");
   if(added.length){
      put(panel,"p","hint","추가되거나 새 표현으로 바뀐 문구 ("+added.length+"개)");
      const area=put(panel,"div","delta");
      makeLines(area,added,"added");
   }
   if(removed.length){
      put(panel,"p","hint","기존 문구에서 삭제되거나 교체된 부분 ("+removed.length+"개)");
      const area=put(panel,"div","delta");
      makeLines(area,removed,"removed");
   }
 }
 if(row.after_text){
   const full=row.diff_status==="editorial_summary"?"변경 내용 요약":"변경 후 효능·효과 전문";
   put(panel,"h3","",full+" · "+fmtDate(row.changed_at));
   if(row.diff_status==="editorial_summary")
      put(panel,"p","hint","확인된 변경사항 요약입니다. 식약처 효능·효과 전문과는 구분됩니다.");
   else if(row.diff_status==="baseline")
      put(panel,"p","hint","비교 가능한 과거 원문이 없습니다.");
   const box=put(panel,"div","fulltext");
   const plus=new Set(added.map(normalizeLine));
   for(const line of row.after_text.split("\n").filter(x=>x.trim())){
      put(box,"div","line current"+(official&&plus.has(normalizeLine(line))?" is-added":""),line);
   }
 }else{
   put(panel,"p","hint","식약처에 변경일은 기록돼 있지만, 해당 시점의 전자화된 효능·효과 전문은 확보되지 않았습니다.");
 }
 if(!hasDelta&&official)
    put(panel,"p","hint","표현상의 변경은 확인됐으나 문장 단위로 뚜렷한 추가·삭제를 구분하기 어렵습니다.");
 const links=put(panel,"div","contents-footer");
 links.appendChild(originalLink(row.evidence_url,"식약처 원문 확인"));
 if(row.supplementary_url&&row.supplementary_url!==row.evidence_url)links.appendChild(originalLink(row.supplementary_url,"변경 확인 근거"));
 put(links,"small","","자료 기준: "+fmtDate(row.changed_at));
 return card;
}
function params(reset){
 if(reset){
   state.filter={q:$("#keyword").value.trim(),year:$("#year").value,type:$("#type").value,scope:$("#scope").value};
 }
 const url=new URL(API);
 url.searchParams.set("view","efficacy");
 url.searchParams.set("offset",String(state.offset));
 url.searchParams.set("limit","20");
 for(const [k,v] of Object.entries(state.filter)){
   if(v&&v!=="all")url.searchParams.set(k,String(v));
 }
 return url.toString();
}
function refreshLabel(){
 $("#resultCount").textContent="검색 결과 "+state.total+"건";
 $("#moreWrap").hidden=!state.more;
 $("#moreButton").disabled=state.busy;
}
async function load(reset=false){
 if(state.busy&&!reset)return;
 const serial=++state.serial;
 if(reset){
   state.offset=0;state.rows=[];state.total=0;state.more=false;
   $("#entries").replaceChildren(element("div","empty","검색 중…"));
 }
 state.busy=true;$("#searchButton").disabled=true;$("#moreButton").disabled=true;
 try{
   const u=params(reset);
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),17000);
   const resp=await fetch(u,{cache:"no-store",signal:controller.signal});
   clearTimeout(timer);
   const data=await resp.json();
   if(!resp.ok||!Array.isArray(data.items))throw Error(data.error||"응답 형식 오류");
   if(serial!==state.serial)return;
   if(reset)$("#entries").replaceChildren();
   const fragment=document.createDocumentFragment();
   for(const item of data.items){
     state.rows.push(item);fragment.appendChild(renderCard(item));
   }
   $("#entries").appendChild(fragment);
   state.offset=data.next_offset;state.total=data.total;state.more=data.has_more;
   if(!state.rows.length)$("#entries").replaceChildren(element("div","empty","검색 조건에 맞는 효능·효과 변경 기록이 없습니다."));
 }catch(e){
   if(serial===state.serial){
      if(reset)$("#entries").replaceChildren(element("div","empty","자료를 불러오지 못했습니다. 다시 검색해주세요."));
      $("#resultCount").textContent="연결 오류: "+String(e.message||e);
      state.more=false;
   }
 }finally{
   if(serial===state.serial){state.busy=false;$("#searchButton").disabled=false;refreshLabel();}
 }
}
const form=$("#searchForm");
form.addEventListener("submit",ev=>{ev.preventDefault();load(true)});
$("#moreButton").addEventListener("click",()=>load(false));
if("IntersectionObserver" in window){
 const observer=new IntersectionObserver(entries=>{
   if(entries.some(e=>e.isIntersecting)&&state.more&&!state.busy)load(false);
 },{rootMargin:"0px 0px 220px 0px"});
 observer.observe($("#sentinel"));
}
for(let y=2026;y>=2014;y--){
 const option=element("option","",String(y)+"년");option.value=String(y);$("#year").appendChild(option);
}
const urlKeyword=(new URLSearchParams(window.location.search)).get("q");
if(urlKeyword)$("#keyword").value=urlKeyword.slice(0,80);
load(true);
})();
</script>
</body>
</html>
