name: desk-browser-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desk-browser-smoke.yml'
      - 'index.html'
      - 'scripts/browser_interaction_smoke.mjs'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test summary and article-writing button clicks in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          export CHROME_BIN
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/desk-http.log 2>&1 &
          node scripts/browser_interaction_smoke.mjs 'http://127.0.0.1:8765/?date=2026-10-13'
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-13'
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-15' 5 domestic
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-16' 23 domestic
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-15' 5 global
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-16' 1 global
      - name: Confirm 13 Oct briefing renders in a real browser without optional CDN
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "CHROME_NOT_AVAILABLE"; exit 1; }
          "$CHROME" --version
          # Block the optional Supabase CDN to ensure published articles do not depend on login SDK.
          timeout 55 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=15000 \
            --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
            --dump-dom 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-13' \
            > /tmp/desk-dom.html 2> /tmp/chrome-stderr.log || {
              echo "BROWSER_DUMP_FAILED"; tail -n 40 /tmp/chrome-stderr.log; exit 1;
            }
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/desk-dom.html').read_text(encoding='utf-8')
          rendered=len(re.findall(r'<article class="card"',html))
          has_date='2026년 10월 13일' in html
          print('BROWSER_13_OCT: card_count=',rendered,'date_label=',has_date)
          if not has_date or rendered<14:
              marker=html.find('id="cards"')
              print('cards_excerpt=',html[max(0,marker-200):marker+1200] if marker>=0 else 'CARD_CONTAINER_MISSING')
              raise SystemExit('PUBLIC_BROWSER_BRIEFING_RENDER_FAILED')
          print('PUBLIC_BROWSER_OK: 2026-10-13, rendered domestic cards >=14, CDN unavailable')
          PY
          # Verify the default URL selects yesterday before a new day's data exists.
          if [[ "$(TZ=Asia/Seoul date +%F)" == "2026-10-14" && \
                ! -f domestic/2026-10-14.json && ! -f global/2026-10-14.json && ! -f data/2026-10-14.json ]]; then
            timeout 55 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-background-networking --virtual-time-budget=15000 \
              --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
              --dump-dom 'https://luckybomb85-tech.github.io/pharm-briefing-desk/' \
              > /tmp/default-dom.html 2> /tmp/default-chrome-stderr.log || {
                echo "DEFAULT_BROWSER_DUMP_FAILED"; tail -n 40 /tmp/default-chrome-stderr.log; exit 1;
              }
            python - <<'PY2'
          import re
          from pathlib import Path
          html=Path('/tmp/default-dom.html').read_text(encoding='utf-8')
          n=len(re.findall(r'<article class="card"',html))
          date_ok='2026년 10월 13일' in html
          print('MIDNIGHT_DEFAULT_BROWSER: card_count=',n,'date_label_oct13=',date_ok)
          if not date_ok or n<14:
              raise SystemExit('MIDNIGHT_DEFAULT_FALLBACK_FAILED')
          print('MIDNIGHT_DEFAULT_OK: no query parameter shows last published date')
          PY2
          fi

      - name: Verify date cutoff and compact curated UI in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for DAY in 2026-10-15 2026-10-16; do
            timeout 60 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-background-networking --virtual-time-budget=16000 \
              --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
              --dump-dom "https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=$DAY" \
              > "/tmp/edition-$DAY.html" 2> "/tmp/edition-error-$DAY.log" || {
                tail -n 25 "/tmp/edition-error-$DAY.log";exit 1;
              }
            DAY="$DAY" python - <<'PY'
          import json,re,urllib.request,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          d=os.environ['DAY']; html=Path('/tmp/edition-'+d+'.html').read_text(encoding='utf-8')
          with urllib.request.urlopen('https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/briefing-feed-v2?date='+d,timeout=20) as f: feed=json.load(f)
          assert '<section id="cards">' in html, 'missing cards section'
          cards=html.split('<section id="cards">',1)[1].split('</section>',1)[0]
          count=len(re.findall(r'<article class="card"',cards))
          assert count==len(feed['domestic']),(d,count,len(feed['domestic']))
          start=datetime.fromisoformat(d+'T06:00:00+09:00')
          back=start-timedelta(hours=18);midnight=datetime.fromisoformat(d+'T00:00:00+09:00')
          for x in feed['domestic']:
              dt=datetime.fromisoformat(x['published_at'].replace('Z','+00:00'))
              assert dt>=start or back<=dt<midnight,(d,x['title'],dt)
          assert 'editorialNotice' not in cards and '수집 후보 '+str(len(feed['domestic']))+'건' not in cards
          assert '기사 선별·요약본' not in html.split('id="dateLabel"',1)[1].split('</div>',1)[0]
          assert '원문 링크와 검증 요청을 포함해 ChatGPT를 엽니다' not in cards
          print('DATE_CUTOFF_UI_OK',d,count)
          PY
          done

      - name: Verify Korean global curated feed and weekend-ready schedule
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.request
          base='https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/briefing-feed-v2?date='
          for date in ('2026-10-15','2026-10-16'):
              with urllib.request.urlopen(base+date,timeout=18) as resp:
                  data=json.load(resp)
              items=data.get('global',[])
              assert items,(date,'NO_SELECTED_GLOBAL')
              assert all(re.search('[가-힣]',x['title']) for x in items),(date,'ENGLISH_GLOBAL_TITLE')
              assert all(x.get('summary','').strip() for x in items),(date,'GLOBAL_SUMMARY_MISSING')
              assert not any('애플' in x['title'] or 'VIABAHN' in x['title'] for x in items)
              print('GLOBAL_KOREAN_FEED_OK',date,len(items))
          PY
