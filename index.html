<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제약바이오 브리핑 데스크</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#132235;--muted:#657386;--line:#dbe3ea;--blue:#173f65;--accent:#2563eb;--red:#c51d46;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,a,input,textarea{font:inherit}.shell{max-width:860px;margin:auto;min-height:100vh;padding-bottom:40px}
header{padding:34px 36px 24px;border-bottom:1px solid var(--line);background:rgba(244,247,250,.97);position:sticky;top:0;z-index:5}
.brandrow{display:flex;align-items:center;gap:16px}.brandicon{width:64px;height:64px;border-radius:22px;background:#173f65;color:#fff;display:grid;place-items:center;font-size:28px}.brand{font-size:27px;font-weight:800;letter-spacing:-.7px}.version{font-size:14px;border:1px solid #cfd9e2;border-radius:999px;padding:3px 10px;margin-left:8px;color:#314156;background:#f8fafc}.gear{margin-left:auto;width:52px;height:52px;border:1px solid #d3dde6;border-radius:17px;background:#f9fbfd;font-size:25px}
.datebar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin-top:22px}.datebar button{border:0;background:transparent;font-size:36px;color:#344356}.date{font-size:23px;font-weight:850;text-align:center;letter-spacing:-.5px;cursor:pointer}.dateinput{position:absolute;opacity:0;pointer-events:none}
.connect{font-size:12px;color:#5e6b7b;text-align:center;margin-top:7px}.connect b{color:#137a52}
main{padding:26px 34px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:24px}.tab{height:66px;border:1px solid #d5dfe8;background:#eef3f7;font-size:23px;color:#344356}.tab:first-child{border-radius:18px 0 0 18px}.tab:last-child{border-radius:0 18px 18px 0}.tab.active{background:#e5ebf0;color:#101b28;font-weight:800;box-shadow:0 4px 14px rgba(31,55,78,.08)}.count{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;margin-left:8px;border-radius:999px;background:#f8fafc;font-size:18px}
.card{background:var(--card);border:1px solid #d8e1e8;border-radius:26px;padding:25px 28px;margin:0 0 18px;box-shadow:0 3px 8px rgba(30,55,80,.11)}
.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden}.pill{border:1px solid #ccd8e1;border-radius:999px;padding:5px 12px;color:#23364b;background:#fff;flex:none}.source{overflow:hidden;text-overflow:ellipsis}.title{font-size:25px;line-height:1.45;letter-spacing:-.65px;margin:13px 0 19px;font-weight:850}
.actions{display:grid;grid-template-columns:1.35fr 1.15fr 1.15fr 58px 58px;gap:8px}.actions button,.actions a{height:50px;border:1px solid #d2dce5;border-radius:15px;background:#f9fbfc;color:#1b2a3b;text-decoration:none;display:grid;place-items:center;font-weight:750;font-size:15px}.vote{font-size:25px!important}.vote.on.up{color:#245eea;border-color:#94adf4;background:#f3f6ff}.vote.on.down{color:var(--red);border-color:#e8a9b8;background:#fff5f7}
.detail{display:none;border-top:1px solid #e7edf2;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:0 0 8px}.detail p{font-size:16px;line-height:1.65;margin:0 0 15px;color:#3d4c5e}.detailtools{display:flex;gap:8px;flex-wrap:wrap}.detailtools button,.detailtools a{border:1px solid #d2dce5;background:#fff;border-radius:12px;padding:9px 12px;text-decoration:none;color:#18283a;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:70px 20px}.settings{display:none;background:#fff;border-bottom:1px solid var(--line);padding:22px 36px}.settings.open{display:block}.settings h2{font-size:18px;margin:0 0 4px}.settings p{color:var(--muted);font-size:13px}.settings label{display:block;font-weight:800;margin:14px 0 5px}.settings textarea{width:100%;min-height:64px;border:1px solid #d5dfe7;border-radius:12px;padding:10px}.settings button{border:0;border-radius:12px;background:#173f65;color:white;padding:10px 16px;font-weight:800}.toast{position:fixed;z-index:20;left:50%;bottom:25px;transform:translateX(-50%);background:#142233;color:#fff;border-radius:12px;padding:11px 16px;display:none}
@media(max-width:640px){header{padding:24px 18px 18px;position:relative}.brandicon{width:52px;height:52px;border-radius:17px;font-size:23px}.brand{font-size:21px}.version{font-size:12px;padding:2px 8px}.gear{width:46px;height:46px;border-radius:15px}.datebar{margin-top:17px}.datebar button{font-size:30px}.date{font-size:20px}.connect{font-size:11px}main{padding:22px 16px}.tabs{margin-bottom:20px}.tab{height:57px;font-size:19px}.count{min-width:34px;height:34px;font-size:15px}.card{border-radius:22px;padding:20px 18px;margin-bottom:14px}.meta{font-size:14px;gap:7px}.pill{padding:4px 9px}.title{font-size:21px;margin:11px 0 17px}.actions{grid-template-columns:1.3fr 1.1fr 1.1fr 52px 52px;gap:6px}.actions button,.actions a{height:48px;font-size:13px;border-radius:14px}.vote{font-size:22px!important}.settings{padding:20px 18px}}
@media(max-width:390px){.brand{font-size:19px}.brandicon{width:48px;height:48px}.actions{grid-template-columns:1fr 1fr 1fr 48px 48px}.actions button,.actions a{font-size:12px}}
</style></head><body><div class="shell">
<header><div class="brandrow"><div class="brandicon">◉</div><div class="brand">제약바이오 브리핑 데스크 <span class="version">v3.7</span></div><button class="gear" id="gear" aria-label="설정">⚙</button></div>
<div class="datebar"><button id="prev" aria-label="이전 날짜">‹</button><div class="date" id="dateLabel"></div><button id="next" aria-label="다음 날짜">›</button><input class="dateinput" id="datePicker" type="date"></div>
<div class="connect"><b>● 텔레그램 연결됨</b> · 자동 게시</div></header>
<section class="settings" id="settings"><h2>브리핑 설정</h2><p>우선 검색 사이트는 현재 이 기기에 저장됩니다. 서버 동기화는 다음 단계에서 연결합니다.</p><label>국내</label><textarea id="sDomestic"></textarea><label>글로벌</label><textarea id="sGlobal"></textarea><label>특허</label><textarea id="sPatent"></textarea><p><button id="saveSettings">설정 저장</button></p></section>
<main><nav class="tabs"><button class="tab active" data-tab="domestic">국내 <span class="count" id="cDomestic">0</span></button><button class="tab" data-tab="global">글로벌 <span class="count" id="cGlobal">0</span></button><button class="tab" data-tab="patent">특허 <span class="count" id="cPatent">0</span></button></nav><section id="cards"></section></main></div><div class="toast" id="toast"></div>
<script>
let D=null,tab='domestic';let current=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return '원문'}}
function fmtDate(s){const [y,m,d]=s.split('-');return y+'년 '+Number(m)+'월 '+Number(d)+'일'}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',1500)}
async function load(date=current){current=date;$('#datePicker').value=date;$('#dateLabel').textContent=fmtDate(date);try{const r=await fetch('./data/'+date+'.json',{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();render()}catch{D=null;render()}}
function render(){const counts={domestic:D?.domestic?.length||0,global:D?.global?.length||0,patent:D?.patent?.length||0};$('#cDomestic').textContent=counts.domestic;$('#cGlobal').textContent=counts.global;$('#cPatent').textContent=counts.patent;const a=D?.[tab]||[];$('#cards').innerHTML=a.length?a.map((x,i)=>card(x,i)).join(''):'<div class="empty">'+fmtDate(current)+' 브리핑이 아직 없습니다.</div>'}
function card(x,i){const rating=localStorage.getItem('rating:'+current+':'+tab+':'+i);const metaTime=x.published_at?'<span>·</span><span>'+esc(x.published_at)+'</span>':'';return '<article class="card"><div class="meta"><span class="pill">'+esc(x.tag||'주목')+'</span><span>·</span><span class="source">'+esc(x.source_name||host(x.source))+'</span>'+metaTime+'</div><div class="title">'+esc(x.title)+'</div><div class="actions"><button onclick="toggleDetail('+i+')">원문·상세</button><button onclick="article('+i+',\'quick\')">빠른 추격</button><button onclick="article('+i+',\'diff\')">차별화</button><button class="vote up '+(rating==='1'?'on':'')+'" onclick="rate('+i+',1)" aria-label="좋아요">♧</button><button class="vote down '+(rating==='-1'?'on':'')+'" onclick="rate('+i+',-1)" aria-label="싫어요">♧</button></div><div class="detail" id="detail-'+i+'"><h3>핵심 요약</h3><p>'+esc(x.summary||'상세 요약이 없습니다.')+'</p><div class="detailtools"><a href="'+esc(x.source)+'" target="_blank" rel="noreferrer">원문 확인 ↗</a><button onclick="article('+i+',\'write\')">기사작성 요청 복사</button></div></div></article>'}
window.toggleDetail=i=>$('#detail-'+i).classList.toggle('open');
function promptFor(x,mode){let p='다음 제약바이오 이슈를 데일리팜 기사로 작성해줘.\n제목: '+x.title+'\n요약: '+x.summary+'\n원문: '+x.source;if(mode==='quick')p+='\n빠른 추격기사 관점으로 핵심 팩트, 새로 확인할 수치, 국내 영향 중심으로 기사화 포인트를 잡아줘.';else if(mode==='diff')p+='\n단순 번역·요약을 피하고 경쟁구도, 숫자, 국내 업계 파급효과에서 차별화 야마와 추가 취재 포인트를 잡아줘.';else p+='\n원문을 우선 확인하고 팩트체크한 뒤 제목·부제와 기사 본문 초안을 작성해줘.';return p}
window.article=async(i,mode)=>{const x=D[tab][i];try{await navigator.clipboard.writeText(promptFor(x,mode));toast(mode==='write'?'기사작성 요청을 복사했습니다':mode==='quick'?'빠른 추격 요청을 복사했습니다':'차별화 요청을 복사했습니다')}catch{toast('복사에 실패했습니다')}};
window.rate=(i,v)=>{localStorage.setItem('rating:'+current+':'+tab+':'+i,String(v));render();toast(v>0?'좋아요를 저장했습니다':'싫어요를 저장했습니다')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
function shift(n){const d=new Date(current+'T12:00:00');d.setDate(d.getDate()+n);load(d.toISOString().slice(0,10))}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#dateLabel').onclick=()=>$('#datePicker').showPicker?.();$('#datePicker').onchange=e=>load(e.target.value);
$('#gear').onclick=()=>$('#settings').classList.toggle('open');const keys=['Domestic','Global','Patent'];keys.forEach(k=>$('#s'+k).value=localStorage.getItem('sources:'+k)||'');$('#saveSettings').onclick=()=>{keys.forEach(k=>localStorage.setItem('sources:'+k,$('#s'+k).value));toast('설정을 저장했습니다')};load();
</script></body></html>
