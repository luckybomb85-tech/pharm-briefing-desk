name: deploy-briefing-desk-pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'global/**'
      - 'domestic/**'
      - '.github/workflows/deploy-desk-pages.yml'
  workflow_run:
    workflows:
      - auditable-briefing-collection
      - global-source-smoke-once
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: briefing-desk-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate latest global desk data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("global").glob("????-??-??.json"))+sorted(Path("domestic").glob("????-??-??.json"))
          if not files:
              raise SystemExit("No global briefing data available")
          for p in files:
              d=json.loads(p.read_text(encoding="utf-8"))
              assert d["date"]==p.stem and isinstance(d["items"],list),p
              assert all(x.get("title") and x.get("source","").startswith("https://") for x in d["items"]),p
          print(f"Validated {len(files)} global briefing dates")
          PY
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for dir in global domestic data live schedule; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
