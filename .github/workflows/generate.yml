name: generate-daily-briefing
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-briefing-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate briefing with live web search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
        run: python scripts/generate_briefing.py
      - name: Hard validate 10-10-5
        run: python scripts/validate_briefing.py --mode today
      - name: Commit today's briefing
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          git config user.name "pharm-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/$DAY.json"
          if git diff --cached --quiet; then
            echo "No briefing changes"
            exit 0
          fi
          git commit -m "Publish $DAY automated briefing 10-10-5"
          git push
