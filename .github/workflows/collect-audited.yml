name: auditable-briefing-collection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_with_evidence.py'
      - 'scripts/verify_originals.py'
      - 'scripts/diagnose_google_news.py'
      - 'scripts/test_verify_originals.py'
      - 'scripts/build_event_map.py'
      - 'scripts/test_event_map.py'
      - '.github/workflows/collect-audited.yml'
  workflow_dispatch:
    inputs:
      briefing_date:
        description: "KST date YYYY-MM-DD (empty for today)"
        required: false
        type: string
  schedule:
    - cron: '45 20 * * 0-4'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test original-source verification
        run: python -m unittest discover -s scripts -p 'test_verify_originals.py' -v
      - name: Unit test duplicate and follow-up event map
        run: python -m unittest discover -s scripts -p 'test_event_map.py' -v
      - name: Scan sources and record honest partial/fail evidence
        env:
          REQUESTED_DATE: ${{ inputs.briefing_date }}
        run: |
          DAY="${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}"
          python scripts/collect_with_evidence.py --date "$DAY"
      - name: Verify originals and record rejected / unchecked candidates
        run: |
          FILE=$(ls status/*-collection-evidence.json | head -1)
          python scripts/verify_originals.py --input "$FILE" --output "$FILE" --limit 100
      - name: Build conservative deduplication and event follow-up map
        run: |
          FILE=$(ls status/*-collection-evidence.json | head -1)
          python scripts/build_event_map.py --input "$FILE" --output "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: status/*-collection-evidence.json
          retention-days: 14
