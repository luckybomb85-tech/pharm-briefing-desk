name: desk-browser-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desk-browser-smoke.yml'
      - 'index.html'
      - 'scripts/browser_interaction_smoke.mjs'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test summary and article-writing button clicks in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          export CHROME_BIN
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/desk-http.log 2>&1 &
          node scripts/browser_interaction_smoke.mjs 'http://127.0.0.1:8765/?date=2026-10-13'
          node scripts/browser_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-13'
      - name: Confirm 13 Oct briefing renders in a real browser without optional CDN
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "CHROME_NOT_AVAILABLE"; exit 1; }
          "$CHROME" --version
          # Block the optional Supabase CDN to ensure published articles do not depend on login SDK.
          timeout 55 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=15000 \
            --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
            --dump-dom 'https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=2026-10-13' \
            > /tmp/desk-dom.html 2> /tmp/chrome-stderr.log || {
              echo "BROWSER_DUMP_FAILED"; tail -n 40 /tmp/chrome-stderr.log; exit 1;
            }
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/desk-dom.html').read_text(encoding='utf-8')
          rendered=len(re.findall(r'<article class="card"',html))
          has_date='2026년 10월 13일' in html
          print('BROWSER_13_OCT: card_count=',rendered,'date_label=',has_date)
          if not has_date or rendered<14:
              marker=html.find('id="cards"')
              print('cards_excerpt=',html[max(0,marker-200):marker+1200] if marker>=0 else 'CARD_CONTAINER_MISSING')
              raise SystemExit('PUBLIC_BROWSER_BRIEFING_RENDER_FAILED')
          print('PUBLIC_BROWSER_OK: 2026-10-13, rendered domestic cards >=14, CDN unavailable')
          PY
          # Verify the default URL selects yesterday before a new day's data exists.
          if [[ "$(TZ=Asia/Seoul date +%F)" == "2026-10-14" && \
                ! -f domestic/2026-10-14.json && ! -f global/2026-10-14.json && ! -f data/2026-10-14.json ]]; then
            timeout 55 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-background-networking --virtual-time-budget=15000 \
              --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
              --dump-dom 'https://luckybomb85-tech.github.io/pharm-briefing-desk/' \
              > /tmp/default-dom.html 2> /tmp/default-chrome-stderr.log || {
                echo "DEFAULT_BROWSER_DUMP_FAILED"; tail -n 40 /tmp/default-chrome-stderr.log; exit 1;
              }
            python - <<'PY2'
          import re
          from pathlib import Path
          html=Path('/tmp/default-dom.html').read_text(encoding='utf-8')
          n=len(re.findall(r'<article class="card"',html))
          date_ok='2026년 10월 13일' in html
          print('MIDNIGHT_DEFAULT_BROWSER: card_count=',n,'date_label_oct13=',date_ok)
          if not date_ok or n<14:
              raise SystemExit('MIDNIGHT_DEFAULT_FALLBACK_FAILED')
          print('MIDNIGHT_DEFAULT_OK: no query parameter shows last published date')
          PY2
          fi

      - name: Verify Oct 15 and Oct 16 curated editions in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "CHROME_NOT_AVAILABLE"; exit 1; }
          for pair in 2026-10-15:11 2026-10-16:10; do
            DAY="${pair%%:*}"
            COUNT="${pair##*:}"
            test -f "data/$DAY.json"
            DAY="$DAY" COUNT="$COUNT" python - <<'PY'
          import json, os
          from pathlib import Path
          date=os.environ["DAY"]; expected=int(os.environ["COUNT"])
          obj=json.loads(Path("data/"+date+".json").read_text(encoding="utf-8"))
          assert obj["status"]=="editorial-selected" and len(obj["domestic"])==expected
          assert all(len(x["summary"])>65 and x["source"].startswith("https://") for x in obj["domestic"])
          print("CURATED_STATIC_OK", date, expected)
          PY
            timeout 60 "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-background-networking --virtual-time-budget=19000 \
              --host-resolver-rules="MAP cdn.jsdelivr.net ~NOTFOUND" \
              --dump-dom "https://luckybomb85-tech.github.io/pharm-briefing-desk/?date=$DAY" \
              > "/tmp/curated-$DAY.html" 2> "/tmp/curated-$DAY-error.log" || {
                tail -n 30 "/tmp/curated-$DAY-error.log"
                exit 1
              }
            DAY="$DAY" COUNT="$COUNT" python - <<'PY'
          import os,re
          from pathlib import Path
          day=os.environ["DAY"]; expected=int(os.environ["COUNT"])
          html=Path("/tmp/curated-"+day+".html").read_text(encoding="utf-8")
          # Chrome's DOM dump also contains the JS source template with '<article class="card">'.
          # Count only actual rendered cards within the #cards section.
          assert '<section id="cards">' in html,(day,"CARDS_SECTION_MISSING")
          content=html.split('<section id="cards">',1)[1].split('</section>',1)[0]
          count=len(re.findall(r'<article class="card"',content))
          assert count==expected,(day,expected,count)
          assert "편집 선별·요약" in html,(day,"NO_CURATED_BANNER")
          assert "수집 후보 88건" not in html,(day,"CANDIDATE_OVERFLOW")
          print("CURATED_BROWSER_OK",day,count)
          PY
          done
