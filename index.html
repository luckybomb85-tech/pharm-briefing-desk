<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제약바이오 브리핑 데스크</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:24px;background:#f6f7f9;color:#16181d}header{display:flex;justify-content:space-between;align-items:end}.tabs button{margin-right:8px;padding:9px 14px}.card{background:#fff;border:1px solid #e3e5e8;border-radius:12px;padding:16px;margin:12px 0}.tag{font-size:12px;font-weight:700}.muted{color:#68707d}a{color:inherit}</style><header><div><h1>제약바이오 브리핑 데스크</h1><div id="date" class="muted"></div></div><div class="tabs"><button data-tab="domestic">국내</button><button data-tab="global">글로벌</button><button data-tab="patent">특허</button></div></header><main id="app"></main><script>let D,tab='domestic';async function load(){D=await fetch('./data/2026-09-30.json').then(r=>r.json());document.querySelector('#date').textContent=D.date+' · '+D.timezone;render()}function render(){const a=D[tab]||[];app.innerHTML=a.map(x=>`<article class="card"><div class="tag">${x.tag}</div><h3>${x.title}</h3><p>${x.summary}</p><a href="${x.source}" target="_blank" rel="noreferrer">원문</a></article>`).join('')}document.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});load()</script></html>
