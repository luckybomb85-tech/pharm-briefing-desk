name: mfds-radar-live-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfds/index.html'
      - 'mfds/edge/index.ts'
      - 'scripts/mfds_radar_interaction_smoke.mjs'
      - '.github/workflows/mfds-radar-live-smoke.yml'
permissions:
  contents: read
jobs:
  verify-live-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify both current and cached-client API formats
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor"
          req=urllib.request.Request(url,headers={"Origin":"https://luckybomb85-tech.github.io","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=25) as resp:
              assert resp.status==200,(resp.status,"HTTP_ERROR")
              assert resp.headers.get("access-control-allow-origin")=="*","CORS_MISSING"
              doc=json.load(resp)
          for key in ("items","events","leads","runs"):
              assert isinstance(doc.get(key),list),("API_FORMAT_MISSING",key)
          assert doc["events"],"NO_VERIFIED_APPROVAL_EVENT"
          print("MFDS_API_OK", {k:len(doc[k]) for k in ("items","events","leads")})
          PY
      - name: Test metric cards, 2025 archive, pagination and mobile in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node scripts/mfds_radar_interaction_smoke.mjs
