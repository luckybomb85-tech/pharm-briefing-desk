<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데일리팜 제약바이오 브리핑 데스크</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#26384b;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:24px auto;background:white;min-height:80vh;border:1px solid #e0e7ee;border-radius:18px;overflow:hidden}header{padding:25px 28px;border-bottom:1px solid #e5ebf1}.brandrow{display:flex;align-items:center;gap:12px}.brandMark{background:#173f65;color:white;font-weight:800;border-radius:10px;padding:12px}.brand{font-size:20px;font-weight:800}.version{font-size:11px;color:#5b6e80;border:1px solid #d7e1eb;padding:4px 7px;border-radius:6px}.datebar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:25px}.date{font-weight:700}.datebar button,.tab{border:1px solid #d8e1ea;border-radius:9px;background:white;color:#26384b;padding:9px 14px;cursor:pointer}.dateinput{border:1px solid #d8e1ea;border-radius:9px;padding:9px}main{padding:24px 28px}.tabs{display:flex;gap:8px;border-bottom:1px solid #e5ebf1;padding-bottom:14px}.tab{font-weight:750}.tab.active{background:#173f65;color:white}.count{opacity:.7}.empty{margin:35px 0;padding:42px 20px;text-align:center;border:1px dashed #d9e1ea;border-radius:14px;color:#68798b;line-height:1.8}@media(max-width:650px){.shell{margin:0;border:0;border-radius:0}.brand{font-size:16px}header,main{padding:18px}.datebar{flex-wrap:wrap}}</style></head><body><div class="shell"><header><div class="brandrow"><div class="brandMark">DP</div><div class="brand">데일리팜 제약바이오 브리핑 데스크</div><span class="version">NEW START</span></div><div class="datebar"><button id="prev" aria-label="이전 날짜">‹</button><div class="date" id="dateLabel"></div><button id="next" aria-label="다음 날짜">›</button><input class="dateinput" id="datePicker" type="date"></div></header><main><nav class="tabs"><button class="tab active" data-tab="domestic">국내 <span class="count">0</span></button><button class="tab" data-tab="global">글로벌 <span class="count">0</span></button><button class="tab" data-tab="patent">특허 <span class="count">0</span></button></nav><section id="cards"><div class="empty">새 브리핑 시스템을 구축 중입니다.<br>기사 수집·요약·배포는 검증 후 연결합니다.</div></section></main></div><script>let date=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});const label=document.getElementById('dateLabel'),picker=document.getElementById('datePicker');function render(){label.textContent=date;picker.value=date}function move(n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);date=d.toISOString().slice(0,10);render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);picker.onchange=()=>{if(picker.value){date=picker.value;render()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b)));render()</script></body></html>
