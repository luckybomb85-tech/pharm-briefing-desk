name: deploy-briefing-desk-pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'global/**'
      - 'domestic/**'
      - '.github/workflows/deploy-desk-pages.yml'
  workflow_run:
    workflows:
      - auditable-briefing-collection
      - global-source-smoke-once
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: briefing-desk-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate global and domestic desk data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("global").glob("????-??-??.json"))+sorted(Path("domestic").glob("????-??-??.json"))
          if not files:
              raise SystemExit("No briefing data available")
          for p in files:
              d=json.loads(p.read_text(encoding="utf-8"))
              assert d["date"]==p.stem and isinstance(d["items"],list),p
              assert all(x.get("title") and x.get("source","").startswith("https://") for x in d["items"]),p
          print(f"Validated {len(files)} briefing dates")
          PY
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for dir in global domestic data live schedule; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
      - name: Verify Oct 13 domestic regression baseline is packaged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          day="2026-10-13"
          src=Path("_site/domestic") / (day+".json")
          if not src.is_file():
              raise SystemExit("OCT13_DOMESTIC_MISSING_FROM_SITE")
          data=json.loads(src.read_text(encoding="utf-8"))
          if data.get("date")!=day or len(data.get("items",[]))<10:
              raise SystemExit("OCT13_DOMESTIC_INCOMPLETE")
          html=Path("_site/index.html").read_text(encoding="utf-8")
          if "./domestic/" not in html or "loadDomesticDiscovery(date)" not in html:
              raise SystemExit("DOMESTIC_LOADER_MISSING")
          print("OCT13_SITE_ASSET_OK: 10 domestic candidates and loader included")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public Pages URL returns latest domestic briefing
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          DAY="$(find domestic -maxdepth 1 -type f -name '????-??-??.json' -printf '%f\n' | sort | tail -n1 | sed 's/\.json$//')"
          if [ -z "$DAY" ]; then echo "NO_DOMESTIC_FILES"; exit 1; fi
          MINIMUM=1
          if [ "$DAY" = "2026-10-13" ]; then MINIMUM=10; fi
          python scripts/verify_deployed_desk.py \
            --base-url "$PUBLISHED_URL" \
            --date "$DAY" \
            --minimum "$MINIMUM" \
            --attempts 8 \
            --delay 12
