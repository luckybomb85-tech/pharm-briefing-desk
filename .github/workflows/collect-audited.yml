name: daily-briefing-editorial-archive
# Old auditable v1 domestic collector depended on deleted config/briefing-settings.json.
# Supabase v2 collects news every day; editorial v3 chooses and summarizes; this job
# preserves the curated output as a static historical archive without Telegram sends.
on:
  schedule:
    - cron: '5 23 * * *' # 08:05 KST, every day including Sat/Sun
  workflow_dispatch:
    inputs:
      briefing_date:
        description: 'KST date YYYY-MM-DD (blank = today)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-audited.yml'
      - 'scripts/publish_v3_editorial_snapshot.py'
permissions:
  contents: write
concurrency:
  group: daily-editorial-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and secure curated feed
        run: |
          python -m py_compile scripts/publish_v3_editorial_snapshot.py
          python - <<'PY'
          import json,urllib.request
          base='https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/briefing-feed-v2?date='
          for date in ('2026-10-15','2026-10-16'):
              with urllib.request.urlopen(base+date,timeout=20) as resp: d=json.load(resp)
              assert d['schema_version']=='briefing-v2' and d['date']==date
              assert len([a for a in d['domestic'] if a.get('selection_status')=='selected'])>=1
              assert len(d['global'])>=1
              print('CURATED_FEED_OK',date)
          PY
      - name: Preserve chosen daily news (no minimum and no Telegram)
        env:
          REQUESTED_DATE: ${{ inputs.briefing_date }}
        run: |
          DAY="${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}"
          python scripts/publish_v3_editorial_snapshot.py "$DAY"
      - name: Commit dated editorial backup if changed
        env:
          REQUESTED_DATE: ${{ inputs.briefing_date }}
        run: |
          DAY="${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! test -f "data/$DAY.json"; then echo "NO_COMPLETED_EDITION_TO_ARCHIVE"; exit 0; fi
          git add "data/$DAY.json"
          if git diff --cached --quiet; then echo "NO_EDITION_CHANGES"; exit 0; fi
          git commit -m "Archive curated briefing $DAY [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
