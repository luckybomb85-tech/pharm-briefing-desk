name: global-source-smoke-once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-source-smoke-once.yml'
      - 'scripts/global_source_collector.py'
      - 'scripts/global_candidate_ranker.py'
      - 'scripts/global_top_verifier.py'
      - 'scripts/test_global_top_verifier.py'
      - 'scripts/verify_originals.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test global source collector offline
        run: python -m unittest discover -s scripts -p 'test_global_source_collector.py' -v
      - name: Test capped original verification offline
        run: python -m unittest discover -s scripts -p 'test_global_top_verifier.py' -v
      - name: Collect global source evidence only
        run: |
          mkdir -p status
          TZ=Asia/Seoul python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from scripts.global_source_collector import scan_global_sources
          from scripts.global_candidate_ranker import select
          from scripts.global_top_verifier import verify_shortlist
          now=lambda:datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          day=datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()
          out=scan_global_sources(day,{},now)
          shortlist=verify_shortlist(select(out["candidates"],limit=30),limit=10)
          Path("status/global-shortlist-latest.json").write_text(json.dumps(shortlist,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("status/global-source-smoke.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          for route in out["routes"]:
              print(f'{route["source"]}: {route["status"]} hits={route["hits"]} in_window={route["in_window_index_hits"]} error={route.get("error","")}')
          print("Total candidates:",len(out["candidates"]))
          print("Originals verified: 0; no publication permitted")
          PY
      - name: Commit compact source health report
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("status/global-source-smoke.json").read_text())
          report={"checked_at":data["checked_at"],"status":data["status"],"request_budget":data["request_budget"],"candidate_count":len(data["candidates"]),"routes":[{"source":r["source"],"status":r["status"],"hits":r["hits"],"in_window_index_hits":r["in_window_index_hits"],"error":r.get("error")} for r in data["routes"]],"originals_verified":0,"publish_allowed":False}
          Path("status/global-source-health-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/global-source-health-latest.json status/global-shortlist-latest.json
          git diff --cached --quiet || (git commit -m "Record global source smoke evidence [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-source-smoke-evidence
          path: |
            status/global-source-smoke.json
            status/global-shortlist-latest.json
          retention-days: 14
