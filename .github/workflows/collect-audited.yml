name: auditable-briefing-collection
on:
  workflow_dispatch:
    inputs:
      briefing_date:
        description: "KST date YYYY-MM-DD (empty for today)"
        required: false
        type: string
  schedule:
    - cron: '45 20 * * 0-4'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan sources and record honest partial/fail evidence
        env:
          REQUESTED_DATE: ${{ inputs.briefing_date }}
        run: |
          DAY="${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}"
          python scripts/collect_with_evidence.py --date "$DAY"
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: status/*-collection-evidence.json
          retention-days: 14
