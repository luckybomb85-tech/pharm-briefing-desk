name: mfds-efficacy-ui-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfds/index.html'
      - 'mfds/edge/index.ts'
      - 'scripts/mfds_radar_interaction_smoke.mjs'
      - '.github/workflows/mfds-radar-live-smoke.yml'
permissions:
  contents: read
jobs:
  efficacy-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official history and original comparison data
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor?view=efficacy"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"Origin":"https://luckybomb85-tech.github.io"}),timeout=22) as resp:
              assert resp.status==200
              assert resp.headers.get("access-control-allow-origin")=="*"
              data=json.load(resp)
          assert data["total"]>=15,data
          assert any(x["product"]=="얼비툭스주" and x["changed_at"]=="2026-07-29" and x["added_lines"] and x["removed_lines"] for x in data["items"])
          assert any(x["product"]=="임핀지주" and x["changed_at"]=="2026-03-23" and x["change_type"]=="추가" for x in data["items"])
          print("EFFICACY_API_OK",data["total"],data["counts"])
          PY
      - name: Test search, type/year sorting, expandable efficacy text and mobile
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mfds-ui-server.log 2>&1 &
          sleep 1
          node scripts/mfds_radar_interaction_smoke.mjs 'http://127.0.0.1:8765/mfds/'
          node scripts/mfds_radar_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/mfds/?v=20261026-efficacy'
