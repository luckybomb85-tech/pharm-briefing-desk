name: briefing-healthcheck

on:
  workflow_dispatch:
  schedule:
    # 07:35 KST Monday-Friday. Validation only; recovery is handled by the ChatGPT post-check.
    - cron: '35 22 * * 0-4'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today's briefing (10 domestic, 10 global, patent up to 5)
        run: python scripts/validate_briefing.py --mode today
