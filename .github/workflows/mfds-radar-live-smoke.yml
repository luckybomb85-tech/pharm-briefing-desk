name: mfds-efficacy-ui-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfds/index.html'
      - 'mfds/edge/index.ts'
      - 'scripts/mfds_radar_interaction_smoke.mjs'
      - '.github/workflows/mfds-radar-live-smoke.yml'
permissions:
  contents: read
jobs:
  efficacy-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official history and original comparison data
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor?view=efficacy"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"Origin":"https://luckybomb85-tech.github.io"}),timeout=22) as resp:
              assert resp.status==200
              assert resp.headers.get("access-control-allow-origin")=="*"
              data=json.load(resp)
          assert data["total"]>=15,data
          assert any(x["product"]=="얼비툭스주" and x["changed_at"]=="2026-07-29" and x["added_count"]>=1 and x["removed_count"]==0 for x in data["items"])
          tev=[x for x in data["items"] if x["product"]=="테빔브라주" and x["changed_at"]=="2025-12-18"]
          assert len(tev)==1,(len(tev),"tevimbra missing")
          assert tev[0]["added_count"]==3 and tev[0]["removed_count"]==0 and tev[0]["editorial_changes"]>=4,tev[0]
          assert {x["context"] for x in tev[0]["change_details"]}=={"비소세포폐암","소세포폐암","비인두암"},tev[0]["change_details"]
          assert any(x["product"]=="임핀지주" and x["changed_at"]=="2026-03-23" and x["change_type"]=="추가" for x in data["items"])
          with urllib.request.urlopen("https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor?view=inspect&item_seq=202303165",timeout=25) as resp:
              drug=json.load(resp)
          assert drug["official_change_total"]==12,drug
          assert drug["official_efficacy_total"]==2,drug
          assert drug["total"]==2,drug
          import urllib.parse
          base="https://mqkhtnryxyntrrfrfing.supabase.co/functions/v1/mfds-indication-monitor?view=lookup&q="+urllib.parse.quote("노보노디스크")
          counts=[]
          for page in (1,2,3):
              with urllib.request.urlopen(base+"&page="+str(page),timeout=30) as resp:
                  r=json.load(resp)
              assert r["total_at_least"]==36,(page,r)
              counts.append(len(r["matches"]))
              assert r["has_more"]==(page<3),(page,r)
          assert counts==[15,15,6],counts
          print("OFFICIAL_CATEGORY_COUNTS_AND_PAGINATION_OK",drug["official_change_total"],drug["official_efficacy_total"],counts)
          print("EFFICACY_API_OK",data["total"],data["counts"])
          PY
      - name: Test search, type/year sorting, expandable efficacy text and mobile
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mfds-ui-server.log 2>&1 &
          sleep 1
          node scripts/mfds_radar_interaction_smoke.mjs 'http://127.0.0.1:8765/mfds/'
          node scripts/mfds_radar_interaction_smoke.mjs 'https://luckybomb85-tech.github.io/pharm-briefing-desk/mfds/?v=20261026-efficacy'
