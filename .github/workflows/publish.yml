name: publish-briefing
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/*.json'
jobs:
  telegram:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-telegram]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate briefing (10 domestic, 10 global, patent up to 5)
        run: python scripts/validate_briefing.py --mode today
      - name: Send Telegram
        run: python scripts/send_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
