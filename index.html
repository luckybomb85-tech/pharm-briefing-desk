<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제약바이오 브리핑 데스크</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17191d;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.eyebrow,.status{font-size:12px;color:#667085}.eyebrow{font-weight:700}.top h1{font-size:24px;margin:4px 0}.datebar{display:flex;align-items:center;gap:8px;margin:16px 0}.datebar button,.tabs button,.actions button,.settings button{border:1px solid #d8dde5;background:white;border-radius:10px;padding:9px 12px;font-weight:650}.datebar input{border:1px solid #d8dde5;border-radius:10px;padding:9px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button.active{background:#17191d;color:white}.card{background:white;border:1px solid #e0e4ea;border-radius:15px;padding:16px;margin:12px 0}.tag{font-size:12px;font-weight:800;color:#596579}.card h2{font-size:18px;line-height:1.38;margin:7px 0}.card p{line-height:1.58;color:#414854}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,.actions button{font-size:13px;text-decoration:none;color:#17191d}.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #edf0f4}.detail.open{display:block}.empty{padding:48px 12px;text-align:center;color:#667085}.settings{display:none;background:white;border:1px solid #e0e4ea;border-radius:15px;padding:16px;margin-top:12px}.settings.open{display:block}.settings textarea{width:100%;min-height:80px;border:1px solid #d8dde5;border-radius:10px;padding:10px}.headActions button{border:0;background:transparent;font-weight:700}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17191d;color:white;padding:10px 14px;border-radius:10px;display:none}@media(max-width:640px){.wrap{padding:14px}.top h1{font-size:21px}.actions button,.actions a{flex:1 1 calc(50% - 8px);text-align:center;border:1px solid #d8dde5;border-radius:10px;padding:9px}.datebar{justify-content:space-between}.datebar input{max-width:150px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">DAILYPHARM · PHARMA/BIOTECH</div><h1>제약바이오 브리핑 데스크</h1><div id="status" class="status">불러오는 중…</div></div><div class="headActions"><button id="settingsBtn">⚙ 설정</button></div></div>
<div id="settings" class="settings"><b>우선 검색 사이트</b><p class="status">섹션별 한 줄에 하나. 이 기기에 저장됩니다.</p><label>국내</label><textarea id="sDomestic"></textarea><label>글로벌</label><textarea id="sGlobal"></textarea><label>특허</label><textarea id="sPatent"></textarea><p><button id="saveSettings">저장</button></p></div>
<div class="datebar"><button id="prev">‹ 이전</button><input id="datePicker" type="date"><button id="next">다음 ›</button></div><div class="tabs"><button data-tab="domestic" class="active">국내</button><button data-tab="global">글로벌</button><button data-tab="patent">특허</button></div><main id="app"></main></div><div id="toast" class="toast"></div>
<script>
let D=null,tab='domestic',current='2026-09-30';const labels={domestic:'국내',global:'글로벌',patent:'특허'},$=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1400)}
async function load(date=current){current=date;$('#datePicker').value=date;$('#status').textContent=date+' 브리핑 불러오는 중…';try{const r=await fetch('./data/'+date+'.json',{cache:'no-store'});if(!r.ok)throw 0;D=await r.json();$('#status').textContent=date+' · '+(D.status==='recovered'?'복구본':'발행본');render()}catch(e){D=null;$('#status').textContent=date+' · 발행 데이터 없음';$('#app').innerHTML='<div class="empty">이 날짜의 브리핑이 아직 없습니다.</div>'}}
function promptFor(x,mode){let p='다음 제약바이오 이슈를 데일리팜 기사로 작성해줘.\n제목: '+x.title+'\n요약: '+x.summary+'\n원문: '+x.source;if(mode==='quick')p+='\n빠른 추격기사 관점으로 핵심 팩트와 국내 영향 중심으로 작성.';else if(mode==='diff')p+='\n단순 번역·요약을 피하고 경쟁구도, 숫자, 국내 업계 파급효과에서 차별화 야마를 찾아 작성.';else p+='\n기사 제목·부제와 본문 초안을 작성.';return p}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('기사작성 요청을 복사했습니다')}catch(e){toast('복사에 실패했습니다')}}
function render(){if(!D)return;const a=D[tab]||[];$('#app').innerHTML=a.length?a.map((x,i)=>'<article class="card"><div class="tag">'+(x.tag||'브리핑')+' · '+labels[tab]+'</div><h2>'+x.title+'</h2><p>'+x.summary+'</p><div class="actions"><a href="'+x.source+'" target="_blank" rel="noreferrer">원문 확인</a><button onclick="toggleDetail('+i+')">원문 상세</button><button onclick="copy(promptFor(D[\''+tab+'\']['+i+'],\'write\'))">기사작성 요청 복사</button><button onclick="copy(promptFor(D[\''+tab+'\']['+i+'],\'quick\'))">빠른 추격기사</button><button onclick="copy(promptFor(D[\''+tab+'\']['+i+'],\'diff\'))">차별화 기사</button><button onclick="rate(\''+tab+'\','+i+',1)">👍</button><button onclick="rate(\''+tab+'\','+i+',-1)">👎</button></div><div id="detail-'+i+'" class="detail"><b>상세 요약</b><p>'+x.summary+'</p><div class="status">원문 링크에서 1차 자료를 확인할 수 있습니다.</div></div></article>').join(''):'<div class="empty">표시할 항목이 없습니다.</div>'}
window.toggleDetail=i=>$('#detail-'+i).classList.toggle('open');window.rate=(t,i,v)=>{localStorage.setItem('rating:'+current+':'+t+':'+i,v);toast(v>0?'좋아요를 저장했습니다':'싫어요를 저장했습니다')};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
function shift(n){const d=new Date(current+'T00:00:00');d.setDate(d.getDate()+n);load(d.toISOString().slice(0,10))}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#datePicker').onchange=e=>load(e.target.value);
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('open');const keys=['Domestic','Global','Patent'];keys.forEach(k=>$('#s'+k).value=localStorage.getItem('sources:'+k)||'');$('#saveSettings').onclick=()=>{keys.forEach(k=>localStorage.setItem('sources:'+k,$('#s'+k).value));toast('설정을 저장했습니다')};load();
</script></body></html>
